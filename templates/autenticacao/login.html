<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <div class="options">
        <a href="{% url 'register' %}">Cadastre-se aqui.</a>
        <a href="{% url 'forgot_password' %}">Esqueceu a senha?</a>
    </div>
</body>
</html>
